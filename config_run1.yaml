# Configuration for "Full Data Run 1" -- a fresh, more careful data
# collection pass (more repeats per height: 15-17 vs. the test run's 5).
# Every output path is isolated under a "run1" namespace so this never
# overwrites or mixes with the earlier test-data outputs (config.yaml)
# or Run 2's outputs (config_run2.yaml).
#
# Run 1 and Run 2 (config_run2.yaml) are independent datasets from two
# different people/experimental setups -- it is expected and fine for
# them to need different Physical Consistency Filter tolerances (see
# consistency_filter below); do not "harmonise" the two configs to match
# without re-validating each dataset's own filter needs.
#
# Workflow is identical to config.yaml: drop a new phyphox export into
# data_dir, add one `height: filename` line under height_files, re-run
#   python main.py config_run1.yaml

data_dir: data/raw/run1
figures_dir: figures/run1
results_csv: report/run1_results_summary.csv
processed_dir: data/processed/run1

g_ref: 9.783
height_uncertainty_m: 0.02
restitution_estimate: 0.8

# Dedicated Run 1 background (~200 s), recorded for this session -- NOT
# the reused test-data background. Its noise floor (mean=-49.2 dB) turned
# out meaningfully different from both the old test-data background
# (-52.8 dB) and the ad hoc quiet-trough estimate taken from inside the
# 0.3 m trial file itself (-43.8 dB) -- reinforcing why a real, dedicated
# background recording per session matters rather than reusing/improvising.
background_file: background_run1.xls

# Height keys are the CORRECTED true drop heights, not the originally
# recorded nominal values (filenames keep the original nominal labels,
# since they're just recording identifiers). A +1.5 cm systematic offset
# was identified in the measurement setup: the tape measure was extended
# outward with a thin metal plate to reach the drop point, and the
# plate's own zero-point/thickness added a consistent 1.5 cm to every
# reading. E.g. the file recorded as "0.3m" was actually dropped from
# 0.315 m. This is a deliberate correction of a known, explained
# systematic -- not a fit to the reference value -- see
# report/process_overview.md for the full justification and its effect
# on the result.
height_files:
  0.315: amp_0.3m_15bounce.xls
  0.415: amp_0.4m_15bounce.xls
  0.515: amp_0.5m_15bounce.xls
  0.615: amp_0.6m_16bounce.xls
  0.715: amp_0.7m_16bounce.xls
  0.815: amp_0.8m_15bounce.xls
  0.915: amp_0.9m_15bounce.xls
  1.015: amp_1.0m_16bounce.xls
  1.115: amp_1.1m_17bounce.xls
  1.215: amp_1.2m_16bounce.xls

cleaning:
  background_trim_s: 10.0
  trial_trim_s: 1.5

detection:
  k_sigma: 5.0
  min_separation_s: 0.05

segmentation:
  min_gap_s: 1.5
  min_impacts_per_group: 2

fitting:
  nyquist_factor: 2.0
  reliability_power: 1.0

# Physical Consistency Filter: drop/truncate a trial's own detected impacts
# if they produce a Delta t_n sequence the bounce model says is implausible
# (see bounce_detection.filter_plausible_bounce_times). Both tolerances were
# selected via run1_grid_search-style optimization DIRECTLY on Run 1 (this
# dataset): a grid search over abs_tolerance_factor x ratio_ceiling, with the
# objective being cross-height chi2/ndf (internal compatibility between
# independently measured heights) -- deliberately NOT pull vs g_ref, since
# selecting nuisance parameters by matching a known reference value on the
# reported dataset itself would be circular. Trial COUNT (160 usable trials)
# is identical across the entire grid, ruling out a degenerate "discard
# disagreeing trials" solution. abs_tolerance_factor is a broad plateau
# (1.5-1.9 all tied at the optimum) -- kept at 1.7. ratio_ceiling=1.3
# (tightened from an earlier default of 1.4) improves chi2/ndf from 3.32 to
# 3.10. An earlier exploration tuned instead on the pilot dataset
# (config.yaml) and found its single best point, (1.5, 1.6), generalised
# poorly when applied to Run 1 untouched (chi2/ndf 3.32 -> 4.50) -- a real
# overfitting result from the pilot's small ~5-repeat sample, documented in
# the report's Appendix A rather than used for the final parameters. Run 2
# (config_run2.yaml) needed meaningfully tighter values (1.2/1.2) for its own
# corrupted intervals -- filter tolerances are dataset-specific, not
# universal; see report/run1_filter_optimization_grid.csv and the report's
# "Step 6" section for the full grid.
consistency_filter:
  enabled: true
  abs_tolerance_factor: 1.7
  ratio_ceiling: 1.3
  max_leading_drop: 2

plots:
  save_summary: true
  save_per_height: true      # also save each height's segmentation diagram + every trial's fit/residual plots
